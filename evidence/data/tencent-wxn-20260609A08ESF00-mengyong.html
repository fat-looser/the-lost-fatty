Ao1BhgMUC6KCBqHyAbNTCQmr4OYAA_870492/0","Fimgurl31":"https://inews.gtimg.com/om_ls/OuLmL20BbD_-jVWMJfAo1BhgMUC6KCBqHyAbNTCQmr4OYAA_196130/0","FisOriginal":"0","lsImgExpType":"1","closeAllAd":0,"politicalOption":"0"}},"cnt_html":"<div class=\"rich_media_content autoTypeSetting24psection\"><section style=\"color: #333; font-size: 16px; line-height: 1.85; margin: 0 auto; max-width: 680px; padding: 0 12px\"><p style=\"color: #888; font-size: 14px; margin-bottom: 24px\"><span leaf=\"\">美国曾经有一档轰动全球的减肥节目，参赛者在魔鬼教练的逼迫下疯狂运动、极端节食，最后每个人都瘦了几十甚至上百斤。但6年后——他们全部反弹了，甚至比参赛前更重。因为他们的基础代谢，被硬生生砍掉了将近700大卡。</span><!--EOP_0--></p><!--PARAGRAPH_0--><h2 style=\"border-left: 4px solid #D84315; color: #D84315; font-size: 20px; margin: 28px 0 14px; padding-left: 12px\"><span leaf=\"\">一、超级减肥王的残酷真相：代谢的&#34;报复&#34;</span></h2><p><span leaf=\"\">《超级减肥王》（The Biggest Loser）跟踪研究发表在肥胖领域顶级期刊 </span><em><span leaf=\"\">Obesity</span></em><span leaf=\"\"> 上（DOI: 10.1002/oby.21538）。研究团队对14名参赛者进行了长达6年的追踪，结果令人不寒而栗：</span><!--EOP_1--></p><!--PARAGRAPH_1--><blockquote style=\"background: #FFF3E0; border-left: 3px solid #D84315; color: #555; font-size: 15px; margin: 16px 0; padding: 10px 16px\"><section><span leaf=\"\"> 平均<!--VERTICAL_CARD_BEGIN_0-->基础代谢率<!--VERTICAL_CARD_END_0-->比预期低了499大卡/天，部分选手高达700大卡以上。体重反弹的同时，</span><strong><span leaf=\"\">代谢率却永远没有回来</span></strong><span leaf=\"\">。 </span></section></blockquote><p><span leaf=\"\">这意味着什么？即使他们吃得和同龄人一样少，身体也在拼命&#34;省电&#34;——把每一口食物都变成脂肪存起来。身体以为饥荒来了，自动开启了不可逆的&#34;省电模式&#34;。</span></p><p style=\"margin-bottom: 20px\"><span leaf=\"\">知名肾脏科医生杰森·冯（Dr. Jason Fung）在临床中发现：在减重这件事上，越听话、天天精打细算卡路里的病人，身体反而越差。于是他翻遍了过去50年的医学文献，在《肥胖密码》（The Obesity Code, 2016）一书中，彻底推翻了统治减重界半个世纪的教条——</span><strong><span leaf=\"\">卡路里进出平衡论</span></strong><span leaf=\"\">。</span></p><section nodeleaf=\"\" style=\"text-align: center\"><!--IMG_0--></section><hr style=\"border: none; border-top: 1px solid #eee; margin: 28px 0\"/><h2 style=\"border-left: 4px solid #D84315; color: #D84315; font-size: 20px; margin: 28px 0 14px; padding-left: 12px\"><span leaf=\"\">二、明尼苏达饥饿实验：1944年就揭穿的谎言</span></h2><p><span leaf=\"\"><!--AIPOS_0-->早在1944年，<!--SECURE_LINK_BEGIN_0-->明尼苏达大学<!--SECURE_LINK_END_0-->做过一个至今被反复引用的经典实验。科学家Ancel Keys找来36个身强体壮的小伙子，每天只给他们吃1500大卡——这几乎就是现在很多减脂轻食餐的标准。</span></p><p><span leaf=\"\">结果6个月后：</span></p><ul class=\"list-paddingleft-1\" style=\"margin: 8px 0 16px; padding-left: 20px\"><li style=\"margin: 6px 0\"><strong><span leaf=\"\">代谢全面崩溃</span></strong><section><span leaf=\"\">：心率、体温断崖式下跌，极度怕冷、无精打采</span></section></li><li style=\"margin: 6px 0\"><strong><span leaf=\"\">心理严重受损</span></strong><section><span leaf=\"\">：陷入深度抑郁，脑子里整天只想着食物</span></section></li><li style=\"margin: 6px 0\"><strong><span leaf=\"\">报复性暴食</span></strong><section><span leaf=\"\">：实验结束放开吃后，体脂率像火箭一样飙升，远超实验前水平</span></section></li></ul><p><span leaf=\"\">屏幕前天天节食减肥的你，对这种现象眼熟吗？</span></p><p><span leaf=\"\">你以为少吃就能瘦，但身体远比你聪明。当热量不够时，它少烧就是了——你没瘦，反而把自己改造成了一台</span><strong><span leaf=\"\">极其容易囤积脂肪的&#34;失控机器&#34;</span></strong><span leaf=\"\">。</span></p><hr style=\"border: none; border-top: 1px solid #eee; margin: 28px 0\"/><h2 style=\"border-left: 4px solid #D84315; color: #D84315; font-size: 20px; margin: 28px 0 14px; padding-left: 12px\"><span leaf=\"\">三、钱包与保险柜：一个改变你认知的比喻</span></h2><p><span leaf=\"\">那在临床上，到底是什么在控制胖瘦？杰森·冯给出明确答案：关键根本不是卡路里，而是一个你每天都在召唤、却从来没正眼看过的激素——</span><strong><span leaf=\"\"><!--SECURE_LINK_BEGIN_1-->胰岛素<!--SECURE_LINK_END_1--></span></strong><span leaf=\"\">。</span></p><p><span leaf=\"\">为了让学生和患者听懂，我常用一个比方：身体有两个储存能量的地方——</span></p><p style=\"margin: 0 0 10px\"><strong><span leaf=\"\">钱包</span></strong><span leaf=\"\"> = 肝脏和肌肉里的糖原。存取很方便，但容量很小。</span></p><p style=\"margin: 0\"><strong><span leaf=\"\">银行保险柜</span></strong><span leaf=\"\"> = 脂肪细胞。容量几乎无限，但存取极其麻烦。</span></p><p><span leaf=\"\">当你吃下精制碳水和游离糖，<!--SECURE_LINK_BEGIN_2-->血糖<!--SECURE_LINK_END_2-->飙升。身体派出一位&#34;大堂经理&#34;——胰岛素，把血液里的糖赶紧收起来。它优先往钱包里塞。如果钱包塞满了，胰岛素就下令：把多余能量通通锁进银行保险柜，变成脂肪。<!--AI_MID_AD_0--></span></p><p><strong><span leaf=\"\">最关键的底层机制来了：</span></strong><span leaf=\"\">只要这位&#34;大堂经理&#34;在场，保险柜的大门就是死死锁住的，你一分钱的脂肪都取不出来！</span></p><blockquote style=\"background: #FFF3E0; border-left: 3px solid #D84315; color: #555; font-size: 15px; margin: 16px 0; padding: 10px 16px\"><section><span leaf=\"\"> 不论你在跑步机上练到天荒地老，身体只会消耗钱包里的糖。糖烧光了，它宁可去烧肌肉，也绝不碰你的脂肪。 </span></section></blockquote><hr style=\"border: none; border-top: 1px solid #eee; margin: 28px 0\"/><h2 style=\"border-left: 4px solid #D84315; color: #D84315; font-size: 20px; margin: 28px 0 14px; padding-left: 12px\"><span leaf=\"\">四、为什么现代人越减越胖？——胰岛素抵抗的恶性循环</span></h2><p><span leaf=\"\"><!--AIPOS_1-->工业食品里充满了精制碳水和隐形糖。更要命的是，&#34;少食多餐&#34;这个流行观念天天让人饿了就吃零食。</span></p><p><span leaf=\"\">这导致胰岛素一天到晚疯狂分泌——&#34;大堂经理&#34;被迫24小时加班，永远在下达囤积脂肪的命令。时间一长，细胞彻底疲劳，对胰岛素脱敏了——</span><strong><span leaf=\"\">这就是&#34;胰岛素抵抗&#34;</span></strong><span leaf=\"\">。</span></p><p><span leaf=\"\">为了强行压下血糖，身体只能分泌成倍的胰岛素。恶性循环就此形成：</span></p><p><span leaf=\"\"> 越胖 → 胰岛素越高 → 越容易把食物锁死成脂肪 → 更胖 → 胰岛素更高 → ... </span></p><p><span leaf=\"\">你身上的脂肪堆积如山，但细胞拿不到能量，觉得自己快饿死了——这就是为什么你永远疲惫、永远控制不住想吃甜食。</span></p><hr style=\"border: none; border-top: 1px solid #eee; margin: 28px 0\"/><h2 style=\"border-left: 4px solid #D84315; color: #D84315; font-size: 20px; margin: 28px 0 14px; padding-left: 12px\"><span leaf=\"\">五、打破死循环的三招：降胰岛素，而非卡路里</span></h2><p><span leaf=\"\"><!--AIPOS_2-->《肥胖密码》给出了三个跨越式方案。记住核心原则：</span><strong><span leaf=\"\">我们要降的是胰岛素，不是卡路里。</span></strong></p><h3 style=\"color: #BF360C; font-size: 17px; margin: 20px 0 10px\"><span leaf=\"\">第一招：坚决停止&#34;少食多餐&#34;，戒掉零食</span></h3><p><span leaf=\"\">每次你塞一块饼干、喝一口含糖饮料，胰岛素就飙升一次。你必须让&#34;大堂经理&#34;下班休息。一日三餐吃饱吃好，两餐之间除了水、黑咖啡和原叶茶，什么都别碰。</span></p><h3 style=\"color: #BF360C; font-size: 17px; margin: 20px 0 10px\"><span leaf=\"\">第二招：改变饮食结构，停止对优质脂肪的恐惧</span></h3><p><span leaf=\"\">糖和精制碳水最刺激胰岛素。而最不容易刺激胰岛素的，反而是被妖魔化了几十年的</span><strong><span leaf=\"\">优质脂肪</span></strong><span leaf=\"\">——橄榄油、<!--SECURE_LINK_BEGIN_3-->牛油果<!--SECURE_LINK_END_3-->、坚果、深海鱼。砍掉游离糖，增加优质蛋白和脂肪，你吃得很满足，胰岛素却非常平稳。</span><strong><span leaf=\"\">保险柜的大门才有机会打开。</span></strong><!--EOP_2--></p><!--PARAGRAPH_2--><h3 style=\"color: #BF360C; font-size: 17px; margin: 20px 0 10px\"><span leaf=\"\">第三招：进行<!--VERTICAL_CARD_BEGIN_1-->间歇性断食<!--VERTICAL_CARD_END_1--></span></h3><p><span leaf=\"\">不要听到&#34;断食&#34;就害怕，它和长期吃不饱的&#34;节食&#34;有天壤之别。断食是在固定的时间窗口内完全不摄入热量。比如经典的&#34;16+8&#34;模式——一天在8小时内把饭吃完，剩下16小时只喝水。</span></p><p><span leaf=\"\">当你停止进食超过12小时，体内的胰岛素会降到冰点，锁死保险柜的大门终于打开了。此时你的代谢不仅不会下降，反而会大幅飙升：</span><strong><span leaf=\"\">身体像一台碎钞机，开始疯狂燃烧囤积多年的陈年脂肪</span></strong><span leaf=\"\">，并启动细胞自噬，帮你清理体内垃圾。</span><!--EOP_3--></p><!--PARAGRAPH_3--><p style=\"color: #2E7D32; font-size: 15px; margin: 0\"><strong><span leaf=\"\">三招总结</span></strong></p><p style=\"color: #555; font-size: 14px; margin: 8px 0 0\"><span leaf=\"\">1. 戒零食，让胰岛素下班  |  2. 优质脂肪替代精制碳水  |  3. 16+8间歇断食</span></p><hr style=\"border: none; border-top: 1px solid #eee; margin: 28px 0\"/><h2 style=\"border-left: 4px solid #D84315; color: #D84315; font-size: 20px; margin: 28px 0 14px; padding-left: 12px\"><span leaf=\"\">六、孟医生的真心话</span></h2><p><span leaf=\"\"><!--AIPOS_3-->减肥不成功，真的不是因为你懒，更不是因为你缺乏意志力。</span></p><p><span leaf=\"\">当现代食品工业用糖衣炮弹绑架了你的荷尔蒙，靠意志力去对抗基因本能，注定会失败。</span></p><p><span leaf=\"\">如果你或者身边的人还在饿着肚子数卡路里，把《肥胖密码》找来看看。你身体的运作方式，远比你想象的要聪明——</span><strong><span leaf=\"\">前提是，你别再跟它作对了。</span></strong></p><hr style=\"border: none; border-top: 1px solid #eee; margin: 28px 0\"/><h3 style=\"color: #999; font-size: 16px; margin: 24px 0 8px\"><span leaf=\"\">参考文献</span></h3><ol class=\"list-paddingleft-1\" style=\"color: #777; font-size: 13px; margin: 0; padding-left: 20px\"><li><section><span leaf=\"\">Hall KD, et al. Persistent metabolic adaptation 6 years after &#34;The Biggest Loser&#34; competition. </span><em><span leaf=\"\">Obesity</span></em><span leaf=\"\">, 2016. DOI: 10.1002/oby.21538.</span></section></li><li><section><span leaf=\"\">Keys A, Brožek J, et al. </span><em><span leaf=\"\">The Biology of Human Starvation</span></em><span leaf=\"\">. University of Minnesota Press, 1950.</span></section></li><li><section><span leaf=\"\">Fung J. </span><em><span leaf=\"\">The Obesity Code: Unlocking the Secrets of Weight Loss</span></em><span leaf=\"\">. Greystone Books, 2016.</span></section></li><!--EOP_4--></ol><!--PARAGRAPH_4--><p style=\"color: #999; font-size: 13px; margin-top: 20px; text-align: center\"><span leaf=\"\">—— 我是孟医生，只讲有证据的医学。关注我，健康不迷路！——</span></p></section><style>.data_color_scheme_dark{--weui-BTN-ACTIVE-MASK: rgba(255, 255, 255, .2)}.data_color_scheme_dark{--weui-BTN-DEFAULT-ACTIVE-BG: rgba(255, 255, 255, .126)}.data_color_scheme_dark{--weui-DIALOG-LINE-COLOR: rgba(255, 255, 255, .1)}.data_color_scheme_dark{--weui-BG-COLOR-ACTIVE: #373737}.data_color_scheme_dark{--weui-BG-6: rgba(255, 255, 255, .1);--weui-ACTIVE-MASK: rgba(255, 255, 255, .1)}.data_color_scheme_dark{--weui-BG-0: #111;--weui-BG-1: #1e1e1e;--weui-BG-5: #2c2c2c;--weui-BLUE-100: #10aeff;--weui-BLUE-120: #0c8bcc;--weui-BLUE-170: #04344d;--weui-BLUE-80: #3fbeff;--weui-BLUE-90: #28b6ff;--weui-BLUE-BG-100: #48a6e2;--weui-BLUE-BG-110: #4095cb;--weui-BLUE-BG-130: #32749e;--weui-BLUE-BG-90: #5aafe4;--weui-BRAND-100: #07c160;--weui-BRAND-120: #059a4c;--weui-BRAND-170: #023a1c;--weui-BRAND-80: #38cd7f;--weui-BRAND-90: #20c770;--weui-BRAND-BG-100: #2aae67;--weui-BRAND-BG-110: #259c5c;--weui-BRAND-BG-130: #1d7a48;--weui-BRAND-BG-90: #3eb575;--weui-GLYPH-WHITE-3: #fff;--weui-GREEN-100: #74a800;--weui-GREEN-120: #5c8600;--weui-GREEN-80: #8fb933;--weui-GREEN-90: #82b01a;--weui-GREEN-BG-110: #6b882d;--weui-GREEN-BG-130: #65802b;--weui-GREEN-BG-90: #85a247;--weui-INDIGO-100: #1196ff;--weui-INDIGO-120: #0d78cc;--weui-INDIGO-170: #052d4d;--weui-INDIGO-80: #40abff;--weui-INDIGO-90: #28a0ff;--weui-INDIGO-BG-100: #0d78cc;--weui-INDIGO-BG-110: #0b6bb7;--weui-INDIGO-BG-130: #09548f;--weui-INDIGO-BG-90: #2585d1;--weui-LIGHTGREEN-100: #3eb575;--weui-LIGHTGREEN-120: #31905d;--weui-L
